<script>
  document.addEventListener('DOMContentLoaded', function () {
    var cdnUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json';
    var rawUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json';
    function load(url) {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 8000);
      return fetch(url, { signal: controller.signal }).then(function (response) {
        if (!response.ok) throw new Error('Citation data unavailable');
        return response.json();
      }).finally(function () { clearTimeout(timer); });
    }
    function render(data) {
      var total = document.getElementById('total_cit');
      if (total && Number.isFinite(data.citedby)) {
        total.textContent = ' · ' + data.citedby.toLocaleString() + ' citations';
        total.hidden = false;
      }
      document.querySelectorAll('.show_paper_citations').forEach(function (element) {
        var publication = (data.publications || {})[element.getAttribute('data')];
        if (publication && Number.isFinite(publication.num_citations)) {
          element.textContent = publication.num_citations.toLocaleString() + (publication.num_citations === 1 ? ' citation' : ' citations');
          element.hidden = false;
        }
      });
    }
    {% if site.google_scholar_stats_use_cdn %}
    load(cdnUrl).catch(function () { return load(rawUrl); }).then(render).catch(function () {});
    {% else %}
    load(rawUrl).then(render).catch(function () {});
    {% endif %}
  });
</script>
