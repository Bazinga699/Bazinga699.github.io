{% assign seo_description = page.description | default: site.description | strip_html | strip_newlines %}
<title>{{ site.title | escape }} · HKU</title>
<meta name="description" content="{{ seo_description | escape }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ site.title | escape }} · HKU">
<meta property="og:description" content="{{ seo_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.author.avatar | absolute_url }}">
<meta property="og:image:alt" content="Portrait of Jun Li">
<meta name="twitter:card" content="summary">
{% if site.google_site_verification %}<meta name="google-site-verification" content="{{ site.google_site_verification }}">{% endif %}
{% if site.bing_site_verification %}<meta name="msvalidate.01" content="{{ site.bing_site_verification }}">{% endif %}
{% if site.baidu_site_verification %}<meta name="baidu-site-verification" content="{{ site.baidu_site_verification }}">{% endif %}
