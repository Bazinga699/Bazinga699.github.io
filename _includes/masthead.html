<header class="masthead">
  <nav id="site-nav" class="site-nav" aria-label="Main navigation">
    <a class="site-nav__brand" href="{{ '/#about-me' | relative_url }}">Jun Li <span lang="zh">李俊</span></a>
    <button class="site-nav__toggle" type="button" aria-expanded="false" aria-controls="site-nav-links">
      <span>Menu</span><span class="site-nav__icon" aria-hidden="true"></span>
    </button>
    <ul id="site-nav-links" class="site-nav__links">
      {% for link in site.data.navigation.main %}
      <li><a href="{{ link.url | relative_url }}">{{ link.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
